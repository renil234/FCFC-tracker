name: AFL team line-up refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "35 8 * * 4" # Thursday 16:35 Perth (UTC+8)
    - cron: "10 9 * * 5" # Friday 17:10 Perth: final Sunday squads / late changes

permissions:
  contents: write

jobs:
  refresh-lineups:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python refresh_lineups.py
      - name: Commit refreshed team statuses
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fcfc_cache.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refresh AFL team line-ups"
            git push
          fi
